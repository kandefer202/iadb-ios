name: Build iADB IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install xcodeproj
        run: |
          gem install xcodeproj --no-document

      - name: Check repository
        run: |
          echo "=== Repository ==="
          ls -la

          echo "=== ADBCore ==="
          find Sources/ADBCore -type f -name "*.swift" | sort

          echo "=== App ==="
          find iADBApp -maxdepth 2 -type f -print | sort

          echo "=== Info.plist ==="
          cat iADBApp/Info.plist

      - name: Generate Xcode project
        run: |
          cat > generate_project.rb <<'RUBY'
          require "xcodeproj"
          require "fileutils"

          PROJECT_NAME = "iADBApp"
          PROJECT_PATH = "#{PROJECT_NAME}.xcodeproj"

          FileUtils.rm_rf(PROJECT_PATH)

          project = Xcodeproj::Project.new(PROJECT_PATH)

          project.root_object.attributes["LastUpgradeCheck"] = "2700"
          project.root_object.attributes["ORGANIZATIONNAME"] = "Filip"

          # ============================================================
          # ADBCore
          # ============================================================

          sources_root = project.main_group.new_group("Sources", "Sources")
          core_group = sources_root.new_group("ADBCore", "ADBCore")

          core_target = project.new_target(
            :static_library,
            "ADBCore",
            :ios,
            "17.0"
          )

          core_target.product_name = "ADBCore"

          core_target.build_configurations.each do |config|
            config.build_settings["PRODUCT_MODULE_NAME"] = "ADBCore"
            config.build_settings["SWIFT_VERSION"] = "6.0"
            config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "17.0"
            config.build_settings["DEFINES_MODULE"] = "YES"
            config.build_settings["SKIP_INSTALL"] = "YES"
            config.build_settings["BUILD_LIBRARY_FOR_DISTRIBUTION"] = "NO"
            config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
            config.build_settings["CLANG_ENABLE_MODULES"] = "YES"
          end

          core_files = Dir.glob("Sources/ADBCore/**/*.swift").sort
          core_file_refs = []

          core_files.each do |path|
            relative = path.sub(%r{\ASources/ADBCore/}, "")
            parts = relative.split("/")
            current_group = core_group

            parts[0...-1].each do |part|
              existing = current_group.groups.find { |g| g.name == part }

              if existing
                current_group = existing
              else
                current_group = current_group.new_group(part, part)
              end
            end

            ref = current_group.new_file(File.expand_path(path))
            core_file_refs << ref
          end

          core_file_refs.each do |ref|
            core_target.source_build_phase.add_file_reference(ref)
          end

          # ============================================================
          # iOS Application
          # ============================================================

          app_group = project.main_group.new_group(
            "iADBApp",
            "iADBApp"
          )

          app_target = project.new_target(
            :application,
            "iADBApp",
            :ios,
            "17.0"
          )

          app_target.product_name = "iADB"

          app_target.build_configurations.each do |config|
            config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.filip.iadb"
            config.build_settings["PRODUCT_NAME"] = "iADB"
            config.build_settings["SWIFT_VERSION"] = "6.0"
            config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "17.0"

            # IMPORTANT:
            # Use the real Info.plist file from the repository.
            config.build_settings["INFOPLIST_FILE"] =
              File.expand_path("iADBApp/Info.plist")

            config.build_settings["GENERATE_INFOPLIST_FILE"] = "NO"

            config.build_settings["TARGETED_DEVICE_FAMILY"] = "1,2"

            config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
            config.build_settings["CLANG_ENABLE_MODULES"] = "YES"

            # Signing is performed later by iPASide.
            config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
            config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
            config.build_settings["CODE_SIGN_IDENTITY"] = ""
            config.build_settings["DEVELOPMENT_TEAM"] = ""

            config.build_settings["LD_RUNPATH_SEARCH_PATHS"] = [
              "$(inherited)",
              "@executable_path/Frameworks"
            ]
          end

          # ============================================================
          # App source files
          # ============================================================

          # DO NOT add Info.plist as a source/build-phase file.
          # Xcode handles it through INFOPLIST_FILE above.

          app_files = [
            "iADBApp.swift",
            "ContentView.swift",
            "ADBViewModel.swift",
            "ScreenView.swift",
            "ScreenViewModel.swift"
          ]

          app_source_refs = []

          app_files.each do |filename|
            path = File.expand_path("iADBApp/#{filename}")
            ref = app_group.new_file(path)
            app_source_refs << ref
          end

          app_source_refs.each do |ref|
            app_target.source_build_phase.add_file_reference(ref)
          end

          # ============================================================
          # System frameworks
          # ============================================================

          sdk_path =
            "/Applications/Xcode.app/Contents/Developer/" \
            "Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"

          frameworks = [
            "System/Library/Frameworks/Foundation.framework",
            "System/Library/Frameworks/Network.framework",
            "System/Library/Frameworks/Security.framework",
            "System/Library/Frameworks/CryptoKit.framework",
            "System/Library/Frameworks/SwiftUI.framework"
          ]

          frameworks.each do |framework|
            ref = project.frameworks_group.new_file(
              File.join(sdk_path, framework)
            )

            app_target.frameworks_build_phase.add_file_reference(
              ref,
              true
            )
          end

          # ============================================================
          # ADBCore dependency
          # ============================================================

          app_target.add_dependency(core_target)

          app_target.frameworks_build_phase.add_file_reference(
            core_target.product_reference,
            true
          )

          # ============================================================
          # Save project
          # ============================================================

          project.save

          puts "Generated #{PROJECT_PATH}"
          RUBY

          ruby generate_project.rb

      - name: Verify generated project
        run: |
          echo "=== Xcode project ==="
          find iADBApp.xcodeproj -maxdepth 2 -type f -print

          echo "=== Source files ==="
          find iADBApp -maxdepth 1 -type f -print

          echo "=== ADBCore files ==="
          find Sources/ADBCore -type f -name "*.swift" | sort

      - name: Build archive
        run: |
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project iADBApp.xcodeproj \
            -scheme iADBApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/iADB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Verify application bundle
        run: |
          APP_PATH=$(find \
            build/iADB.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          echo "=== APP PATH ==="
          echo "$APP_PATH"

          echo "=== APP CONTENTS ==="
          find "$APP_PATH" -maxdepth 2 -print | sort

          echo "=== Info.plist ==="

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist is missing from the application bundle!"
            exit 1
          fi

          ls -lh "$APP_PATH/Info.plist"

          echo "=== Bundle information ==="

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"

          echo "=== Executable ==="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist"
          )

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Bundle executable '$EXECUTABLE' is missing!"
            exit 1
          fi

          ls -lh "$APP_PATH/$EXECUTABLE"

          echo "=== Bundle verification OK ==="

      - name: Create IPA
        run: |
          APP_PATH=$(find \
            build/iADB.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          echo "Using:"
          echo "$APP_PATH"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -r iADB.ipa Payload
          cd ..

          echo "=== IPA ==="
          ls -lh build/iADB.ipa

          echo "=== IPA CONTENTS ==="
          unzip -l build/iADB.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iADB-unsigned-ipa
          path: build/iADB.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: iADB-xcarchive
          path: build/iADB.xcarchive
          if-no-files-found: error
          retention-days: 7

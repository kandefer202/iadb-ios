name: Build iADB IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== XCODE PROJECTS ==="
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" \) -print

      - name: Build ADBCore
        run: |
          xcodebuild \
            -scheme ADBCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: List build products
        run: |
          find . -type d -name "*.app" -o -type f -name "*.framework"

name: Build iADB IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Swift ==="
          swift --version

      - name: Install xcodeproj
        run: |
          gem install xcodeproj --no-document

      - name: Check repository
        run: |
          echo "=== Repository ==="
          ls -la

          echo "=== ADBCore ==="
          find Sources/ADBCore -type f -name "*.swift" | sort

          echo "=== App ==="
          find iADBApp -maxdepth 2 -type f -print | sort

          echo "=== Info.plist ==="
          cat iADBApp/Info.plist

      - name: Prepare source files
        run: |
          echo "Removing standalone ADBCore imports..."

          sed -i '' '/^import ADBCore$/d' \
            iADBApp/ADBViewModel.swift \
            iADBApp/ScreenViewModel.swift

          echo "=== ADBViewModel.swift imports ==="
          head -n 10 iADBApp/ADBViewModel.swift

          echo "=== ScreenViewModel.swift imports ==="
          head -n 10 iADBApp/ScreenViewModel.swift

      - name: Generate Xcode project
        run: |
          cat > generate_project.rb <<'RUBY'
          require "xcodeproj"
          require "fileutils"

          PROJECT_NAME = "iADBApp"
          PROJECT_PATH = "#{PROJECT_NAME}.xcodeproj"

          FileUtils.rm_rf(PROJECT_PATH)

          project = Xcodeproj::Project.new(PROJECT_PATH)

          project.root_object.attributes["LastUpgradeCheck"] = "2700"
          project.root_object.attributes["ORGANIZATIONNAME"] = "Filip"

          # ============================================================
          # Application target
          # ============================================================

          app_target = project.new_target(
            :application,
            "iADBApp",
            :ios,
            "17.0"
          )

          app_target.product_name = "iADB"

          app_target.build_configurations.each do |config|
            config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.filip.iadb"
            config.build_settings["PRODUCT_NAME"] = "iADB"

            config.build_settings["SWIFT_VERSION"] = "6.0"
            config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "17.0"

            config.build_settings["INFOPLIST_FILE"] =
              File.expand_path("iADBApp/Info.plist")

            config.build_settings["GENERATE_INFOPLIST_FILE"] = "NO"

            config.build_settings["TARGETED_DEVICE_FAMILY"] = "1,2"

            config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
            config.build_settings["CLANG_ENABLE_MODULES"] = "YES"

            # Unsigned archive.
            # iPASide will sign the IPA later.
            config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
            config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
            config.build_settings["CODE_SIGN_IDENTITY"] = ""
            config.build_settings["DEVELOPMENT_TEAM"] = ""

            config.build_settings["LD_RUNPATH_SEARCH_PATHS"] = [
              "$(inherited)",
              "@executable_path/Frameworks"
            ]
          end

          # ============================================================
          # App group
          # ============================================================

          app_group = project.main_group.new_group(
            "iADBApp",
            "iADBApp"
          )

          # ============================================================
          # Application source files
          # ============================================================

          app_files = [
            "iADBApp.swift",
            "ContentView.swift",
            "ADBViewModel.swift",
            "ScreenView.swift",
            "ScreenViewModel.swift"
          ]

          app_files.each do |filename|
            path = File.expand_path("iADBApp/#{filename}")

            ref = app_group.new_file(path)

            app_target.source_build_phase.add_file_reference(ref)
          end

          # ============================================================
          # ADBCore source files
          #
          # ADBCore is compiled directly into the application target.
          # There is intentionally NO separate static library target.
          # ============================================================

          sources_root = project.main_group.new_group(
            "Sources",
            "Sources"
          )

          core_group = sources_root.new_group(
            "ADBCore",
            "ADBCore"
          )

          core_files = Dir.glob(
            "Sources/ADBCore/**/*.swift"
          ).sort

          puts "=== ADBCore source files ==="

          core_files.each do |path|
            relative = path.sub(
              %r{\ASources/ADBCore/},
              ""
            )

            parts = relative.split("/")
            current_group = core_group

            parts[0...-1].each do |part|
              existing = current_group.groups.find do |group|
                group.name == part
              end

              if existing
                current_group = existing
              else
                current_group = current_group.new_group(
                  part,
                  part
                )
              end
            end

            ref = current_group.new_file(
              File.expand_path(path)
            )

            app_target.source_build_phase.add_file_reference(ref)

            puts "Added: #{path}"
          end

          # ============================================================
          # System frameworks
          # ============================================================

          sdk_path =
            "/Applications/Xcode.app/Contents/Developer/" \
            "Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"

          frameworks = [
            "System/Library/Frameworks/Foundation.framework",
            "System/Library/Frameworks/Network.framework",
            "System/Library/Frameworks/Security.framework",
            "System/Library/Frameworks/CryptoKit.framework",
            "System/Library/Frameworks/SwiftUI.framework"
          ]

          frameworks.each do |framework|
            path = File.join(
              sdk_path,
              framework
            )

            ref = project.frameworks_group.new_file(path)

            app_target.frameworks_build_phase.add_file_reference(
              ref,
              true
            )
          end

          # ============================================================
          # Save
          # ============================================================

          project.save

          puts ""
          puts "========================================"
          puts "Generated #{PROJECT_PATH}"
          puts "========================================"
          RUBY

          ruby generate_project.rb

      - name: Verify generated project
        run: |
          echo "=== Xcode project ==="
          find iADBApp.xcodeproj -maxdepth 2 -type f -print

          echo ""
          echo "=== App source files ==="
          find iADBApp -maxdepth 1 -type f -name "*.swift" -print | sort

          echo ""
          echo "=== ADBCore source files ==="
          find Sources/ADBCore -type f -name "*.swift" | sort

          echo ""
          echo "=== Checking Screen files ==="

          test -f iADBApp/ScreenView.swift
          test -f iADBApp/ScreenViewModel.swift

          echo "ScreenView.swift OK"
          echo "ScreenViewModel.swift OK"

      - name: Build archive
        run: |
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project iADBApp.xcodeproj \
            -scheme iADBApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/iADB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Verify application bundle
        run: |
          APP_PATH=$(find \
            build/iADB.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          echo "=== APP PATH ==="
          echo "$APP_PATH"

          echo ""
          echo "=== APP CONTENTS ==="
          find "$APP_PATH" -maxdepth 2 -print | sort

          echo ""
          echo "=== Info.plist ==="

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist is missing!"
            exit 1
          fi

          ls -lh "$APP_PATH/Info.plist"

          echo ""
          echo "=== Bundle information ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"

          echo ""
          echo "=== Executable ==="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist"
          )

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Bundle executable '$EXECUTABLE' is missing!"
            exit 1
          fi

          ls -lh "$APP_PATH/$EXECUTABLE"

          echo ""
          echo "=== Bundle verification OK ==="

      - name: Create IPA
        run: |
          APP_PATH=$(find \
            build/iADB.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found"
            exit 1
          fi

          echo "Using:"
          echo "$APP_PATH"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build

          zip -r iADB.ipa Payload

          cd ..

          echo ""
          echo "=== IPA ==="
          ls -lh build/iADB.ipa

          echo ""
          echo "=== IPA CONTENTS ==="
          unzip -l build/iADB.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iADB-unsigned-ipa
          path: build/iADB.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: iADB-xcarchive
          path: build/iADB.xcarchive
          if-no-files-found: error
          retention-days: 7
